/* ─── Cube helpers ──────────────────────────────────────────────────────────── */
function compressCube(cube){
  const tables={};const CAT=["proveedor","rubro","vendedor","rentabilidad","provincia","cliente","empresa","localidad","zona"]
  CAT.forEach(f=>{tables[f]=[...new Set(cube.map(r=>r[f]).filter(v=>v!=null))]})
  const ix={};CAT.forEach(f=>{ix[f]=Object.fromEntries(tables[f].map((v,i)=>[v,i]))})
  const rows=cube.map(r=>[r.y,r.m,Math.round(r.precio),r.cantidad,Math.round(r.costo),r.rows,
    r.proveedor!=null?(ix.proveedor[r.proveedor]??-1):-1,r.rubro!=null?(ix.rubro[r.rubro]??-1):-1,
    r.vendedor!=null?(ix.vendedor[r.vendedor]??-1):-1,r.rentabilidad!=null?(ix.rentabilidad[r.rentabilidad]??-1):-1,
    r.provincia!=null?(ix.provincia[r.provincia]??-1):-1,r.cliente!=null?(ix.cliente[r.cliente]??-1):-1,
    r.empresa!=null?(ix.empresa[r.empresa]??-1):-1,r.localidad!=null?(ix.localidad[r.localidad]??-1):-1,
    r.zona!=null?(ix.zona[r.zona]??-1):-1])
  return{tables,rows}
}
function decompressCube({tables,rows}){
  return rows.map(r=>({y:r[0],m:r[1],precio:r[2],cantidad:r[3],costo:r[4],rows:r[5],
    proveedor:r[6]>=0?tables.proveedor[r[6]]:null,rubro:r[7]>=0?tables.rubro[r[7]]:null,
    vendedor:r[8]>=0?tables.vendedor[r[8]]:null,rentabilidad:r[9]>=0?tables.rentabilidad[r[9]]:null,
    provincia:r[10]>=0?tables.provincia[r[10]]:null,cliente:r[11]>=0?tables.cliente[r[11]]:null,
    empresa:r[12]>=0?tables.empresa[r[12]]:null,localidad:r[13]>=0?tables.localidad[r[13]]:null,
    zona:r[14]>=0?tables.zona[r[14]]:null}))
}
function compressArts(arts){return arts.map(a=>[a.name,Math.round(a.precio),a.cantidad,Math.round(a.costo),a.rows,a.rentabilidad??null])}
function decompressArts(rows){return rows.map(r=>({name:r[0],precio:r[1],cantidad:r[2],costo:r[3],rows:r[4],rentabilidad:r[5]}))}
function buildCube(rawRecords){
  const cm={},am={},pm={},rm={}
  for(const r of rawRecords){
    const ck=`${r.y}|${r.m}|${r.proveedor??''} |${r.rubro??''} |${r.vendedor??''} |${r.rentabilidad??''} |${r.provincia??''} |${r.cliente??''} |${r.empresa??''} |${r.localidad??''} |${r.zona??''} `
    if(!cm[ck]) cm[ck]={y:r.y,m:r.m,precio:0,cantidad:0,costo:0,rows:0,proveedor:r.proveedor,rubro:r.rubro,vendedor:r.vendedor,rentabilidad:r.rentabilidad,provincia:r.provincia,cliente:r.cliente,empresa:r.empresa,localidad:r.localidad,zona:r.zona}
    const c=cm[ck];c.precio+=r.precio;c.cantidad+=r.cantidad;c.costo+=r.costo;c.rows++
    if(r.articulo){
      if(!am[r.articulo]) am[r.articulo]={name:r.articulo,precio:0,cantidad:0,costo:0,rows:0,rentabilidad:r.rentabilidad}
      const a=am[r.articulo];a.precio+=r.precio;a.cantidad+=r.cantidad;a.costo+=r.costo;a.rows++
      if(r.proveedor){if(!pm[r.proveedor]) pm[r.proveedor]={};if(!pm[r.proveedor][r.articulo]) pm[r.proveedor][r.articulo]={precio:0,cantidad:0};pm[r.proveedor][r.articulo].precio+=r.precio;pm[r.proveedor][r.articulo].cantidad+=r.cantidad}
      if(r.rubro){if(!rm[r.rubro]) rm[r.rubro]={};if(!rm[r.rubro][r.articulo]) rm[r.rubro][r.articulo]={precio:0,cantidad:0};rm[r.rubro][r.articulo].precio+=r.precio;rm[r.rubro][r.articulo].cantidad+=r.cantidad}
    }
  }
  const compressXRef=m=>Object.fromEntries(Object.entries(m).map(([k,arts])=>[k,Object.entries(arts).sort((a,b)=>b[1].precio-a[1].precio).slice(0,20).map(([name,v])=>[name,Math.round(v.precio),v.cantidad])]))
  return{cube:Object.values(cm),articulos:Object.values(am),provArts:compressXRef(pm),ruboArts:compressXRef(rm)}
}
function mergeCubes(a,b){
  const m={}
  const add=r=>{const k=`${r.y}|${r.m}|${r.proveedor??''} |${r.rubro??''} |${r.vendedor??''} |${r.rentabilidad??''} |${r.provincia??''} |${r.cliente??''} |${r.empresa??''} |${r.localidad??''} |${r.zona??''} `;if(!m[k]) m[k]={...r};else{m[k].precio+=r.precio;m[k].cantidad+=r.cantidad;m[k].costo+=r.costo;m[k].rows+=r.rows}}
  a.forEach(add);b.forEach(add);return Object.values(m)
}
function mergeArts(a,b){
  const m={}
  const add=r=>{if(!m[r.name]) m[r.name]={...r};else{m[r.name].precio+=r.precio;m[r.name].cantidad+=r.cantidad;m[r.name].costo+=r.costo;m[r.name].rows+=r.rows}}
  a.forEach(add);b.forEach(add);return Object.values(m)
}
function mergeXRef(a,b){
  const m={...a}
  Object.entries(b).forEach(([key,arts])=>{
    if(!m[key]){m[key]=arts;return}
    const map={}
    m[key].forEach(([n,p,q])=>{map[n]=[n,p,q]})
    arts.forEach(([n,p,q])=>{if(map[n]){map[n][1]+=p;map[n][2]+=q}else map[n]=[n,p,q]})
    m[key]=Object.values(map).sort((a,b)=>b[1]-a[1]).slice(0,20)
  })
  return m
}
async function loadData(){
  try{
    const[cv,av,mv,pv,rv]=await Promise.all([dbGet(SK),dbGet(AK),dbGet(MK),dbGet(PAK),dbGet(RAK)])
    return{
      cube:cv?decompressCube(JSON.parse(cv)):null,
      articulos:av?decompressArts(JSON.parse(av)):null,
      meta:mv?JSON.parse(mv):null,
      provArts:pv?JSON.parse(pv):null,
      ruboArts:rv?JSON.parse(rv):null,
    }
  }catch(e){return{cube:null,articulos:null,meta:null,provArts:null,ruboArts:null,error:String(e)}}
}
async function saveData(cube,arts,meta,provArts,ruboArts){
  const cs=JSON.stringify(compressCube(cube)),as=JSON.stringify(compressArts(arts)),ms=JSON.stringify(meta)
  const ps=JSON.stringify(provArts||{}),rs=JSON.stringify(ruboArts||{})
  const kb=Math.round((cs.length+as.length+ms.length+ps.length+rs.length)/1024)
  await Promise.all([dbSet(SK,cs),dbSet(AK,as),dbSet(MK,ms),dbSet(PAK,ps),dbSet(RAK,rs)])
  return kb
}

function autoMap(headers){
  const map={};const norm=s=>s?.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim()
  CAMPOS.forEach(({key,syn})=>{const h=headers.find(h=>syn.some(x=>norm(h)?.includes(x)));if(h) map[key]=h})
  return map
}
function parseDate(v){
  if(!v) return null
  if(typeof v==="number"){const d=XLSX.SSF.parse_date_code(v);if(d) return{y:d.y,m:d.m-1}}
  const s=String(v);let mm
  if((mm=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/))) return{y:+mm[3],m:+mm[2]-1}
  if((mm=s.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})$/))) return{y:+mm[1],m:+mm[2]-1}
  const d=new Date(v);if(!isNaN(d)) return{y:d.getFullYear(),m:d.getMonth()}
  return null
}

    <div style={{display:"flex",flexDirection:"column",gap:3,minWidth:180}}>

function BarList({data,colorFn,totalVentas,totalUnidades,hasCantidad,limit=10}){

  const total=metric==="pesos"?totalVentas:totalUnidades
  const color=typeof colorFn==="string"?colorFn:(colorFn?colorFn(metric):BRAND)
  const valFn=d=>metric==="pesos"?fmtM(d.ventas):fmtU(d.cantidad)

function RubrosTab({data,filteredRecords,ruboArts,hasCantidad,totalVentas,totalUnidades}){
  const[sel,setSel]=useState(null)
  const[metric,setMetric]=useState("pesos")
  const[search,setSearch]=useState("")
  const allMonths=[...new Set(filteredRecords.map(r=>r.m).filter(v=>v!==undefined))].sort((a,b)=>a-b)
  const[mesDesde,setMesDesde]=useState("__ALL__")
  const[mesHasta,setMesHasta]=useState("__ALL__")

  const baseRecs=filteredRecords.filter(r=>{
    if(mesDesde!=="__ALL__"&&r.m<parseInt(mesDesde)) return false
    if(mesHasta!=="__ALL__"&&r.m>parseInt(mesHasta)) return false
    return true
  })

  const ruboMapLocal={}
  baseRecs.forEach(r=>{
    const k=r.rubro||"Sin rubro"
    if(!ruboMapLocal[k]) ruboMapLocal[k]={name:k,ventas:0,cantidad:0,rows:0}
    ruboMapLocal[k].ventas+=r.precio
    ruboMapLocal[k].cantidad+=r.cantidad
    ruboMapLocal[k].rows+=(r.rows||1)
  })
  const localData=Object.values(ruboMapLocal)
  const totalVentasLocal=baseRecs.reduce((s,r)=>s+r.precio,0)
  const totalUnidadesLocal=baseRecs.reduce((s,r)=>s+r.cantidad,0)

  const filtered=localData.filter(d=>!search||d.name.toLowerCase().includes(search.toLowerCase()))
  const sorted=metric==="pesos"?[...filtered].sort((a,b)=>b.ventas-a.ventas):[...filtered].sort((a,b)=>b.cantidad-a.cantidad)
  const maxV=sorted[0]?.[metric==="pesos"?"ventas":"cantidad"]||1
  const total=metric==="pesos"?totalVentasLocal:totalUnidadesLocal

  function getArtsRubro(ruboName){
    const map={}
    baseRecs.filter(r=>r.rubro===ruboName&&r.articulo).forEach(r=>{if(!map[r.articulo]) map[r.articulo]=[r.articulo,0,0];map[r.articulo][1]+=r.precio;map[r.articulo][2]+=r.cantidad})
    return Object.values(map).sort((a,b)=>b[1]-a[1]).slice(0,10)
  }

  const inputStyle={background:"rgba(255,255,255,0.05)",border:`1px solid ${BORDER}`,borderRadius:6,color:TEXT,fontSize:12,padding:"5px 10px",outline:"none"}

        {allMonths.length>1&&(<>
          <div style={{display:"flex",alignItems:"center",gap:6}}>
            <span style={{fontSize:11,color:MUTED,whiteSpace:"nowrap"}}>Mes desde:</span>
            <select value={mesDesde} onChange={e=>{setMesDesde(e.target.value);if(e.target.value!=="__ALL__"&&mesHasta!=="__ALL__"&&parseInt(e.target.value)>parseInt(mesHasta))setMesHasta(e.target.value)}} style={selStyle}>
              <option value="__ALL__">Todos</option>
              {allMonths.map(m=><option key={m} value={String(m)}>{MESES[m-1]||m}</option>)}
            </select>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:6}}>
            <span style={{fontSize:11,color:MUTED,whiteSpace:"nowrap"}}>Hasta:</span>
            <select value={mesHasta} onChange={e=>setMesHasta(e.target.value)} style={selStyle}>
              <option value="__ALL__">Todos</option>
              {allMonths.filter(m=>mesDesde==="__ALL__"||m>=parseInt(mesDesde)).map(m=><option key={m} value={String(m)}>{MESES[m-1]||m}</option>)}
            </select>

        <div style={{marginLeft:"auto",display:"flex",alignItems:"center",gap:8}}>

      {sorted.map((d,i)=>{

        return(

function ClientesPeriodoTab({filteredRecords,meta}){
  const[selVends,setSelVends]=useState([])
  const[selZonas,setSelZonas]=useState([])
  const[metric,setMetric]=useState("pesos")
  const[searchV,setSearchV]=useState("")
  const[searchZ,setSearchZ]=useState("")

  const vendedores=[...new Set(filteredRecords.map(r=>r.vendedor).filter(Boolean))].sort()
  const zonas=[...new Set(filteredRecords.map(r=>r.zona).filter(Boolean))].sort()

  const toggleVend=v=>setSelVends(p=>p.includes(v)?p.filter(x=>x!==v):[...p,v])
  const toggleZona=z=>setSelZonas(p=>p.includes(z)?p.filter(x=>x!==z):[...p,z])

  const base=filteredRecords.filter(r=>{
    if(selVends.length>0&&!selVends.includes(r.vendedor)) return false
    if(selZonas.length>0&&!selZonas.includes(r.zona)) return false
    return true
  })

  const periods=[...new Set(base.map(r=>toPeriod(r.y,r.m)).filter(v=>v>0))].sort((a,b)=>a-b)

  const zoneData={}
  base.forEach(r=>{
    const zona=r.zona||"Sin zona"
    const cl=r.cliente||"Sin cliente"
    const p=toPeriod(r.y,r.m)
    if(!zoneData[zona]) zoneData[zona]={}
    if(!zoneData[zona][cl]) zoneData[zona][cl]={}
    if(!zoneData[zona][cl][p]) zoneData[zona][cl][p]={ventas:0,cantidad:0}
    zoneData[zona][cl][p].ventas+=r.precio
    zoneData[zona][cl][p].cantidad+=r.cantidad
  })

  const sortedZonas=Object.keys(zoneData).sort()
  const valFn=(zona,cl,p)=>{const d=zoneData[zona]?.[cl]?.[p];return d?(metric==="pesos"?d.ventas:d.cantidad):0}
  const clientTotal=(zona,cl)=>periods.reduce((s,p)=>s+valFn(zona,cl,p),0)
  const zoneTotal=zona=>Object.keys(zoneData[zona]||{}).reduce((s,cl)=>s+clientTotal(zona,cl),0)
  const grandTotal=sortedZonas.reduce((s,z)=>s+zoneTotal(z),0)
  const periodGrandTotal=p=>base.filter(r=>toPeriod(r.y,r.m)===p).reduce((s,r)=>s+(metric==="pesos"?r.precio:r.cantidad),0)
  const totalClients=sortedZonas.reduce((s,z)=>s+Object.keys(zoneData[z]).length,0)

  const T1="#FFFFFF",T2="#A0A0A0",T3="#555555"
  const inputS={width:"100%",background:"rgba(255,255,255,0.04)",border:`1px solid ${BORDER}`,borderRadius:6,padding:"5px 8px",color:T2,fontSize:11,outline:"none",marginBottom:6,fontFamily:"inherit"}
  const listS={display:"flex",flexDirection:"column",gap:2,maxHeight:140,overflowY:"auto"}
  const itemBase={display:"flex",alignItems:"center",gap:8,padding:"5px 8px",borderRadius:6,cursor:"pointer"}

  if(!meta?.hasCliente) return(
    <div style={{background:CARD,border:`1px solid ${BORDER}`,borderRadius:12,padding:32,textAlign:"center"}}>
      <div style={{fontSize:14,color:T2}}>No hay datos de clientes en este período.</div>
    </div>
  )

  return(
    <div style={{display:"flex",flexDirection:"column",gap:12}}>

      <div id="clientes-filter-panel" style={{background:CARD,border:`1px solid ${BORDER}`,borderRadius:12,padding:"14px 16px",display:"grid",gridTemplateColumns:"1fr 1fr auto",gap:16,alignItems:"start"}}>

        {vendedores.length>0&&(
          <div>
            <div style={{fontSize:9,textTransform:"uppercase",letterSpacing:1.2,color:T3,marginBottom:8,fontWeight:500}}>
              Vendedor {selVends.length>0&&<span style={{color:BRAND}}>· {selVends.length} sel.</span>}
            </div>
            <input value={searchV} onChange={e=>setSearchV(e.target.value)} placeholder="Buscar..." style={inputS}/>
            <div style={listS}>
              {vendedores.filter(v=>v.toLowerCase().includes(searchV.toLowerCase())).map(v=>(
                <div key={v} onClick={()=>toggleVend(v)} style={{...itemBase,background:selVends.includes(v)?"rgba(59,130,246,0.1)":"transparent"}}>
                  <div style={{width:14,height:14,borderRadius:4,border:`1px solid ${selVends.includes(v)?BRAND:BORDER}`,background:selVends.includes(v)?BRAND:"transparent",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,fontSize:9,color:"#fff"}}>
                    {selVends.includes(v)&&"✓"}
                  </div>
                  <span style={{fontSize:12,color:selVends.includes(v)?T1:T2,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{v}</span>
                </div>
              ))}
            </div>
          </div>
        )}

        {zonas.length>0&&(
          <div>
            <div style={{fontSize:9,textTransform:"uppercase",letterSpacing:1.2,color:T3,marginBottom:8,fontWeight:500}}>

            </div>

                <div key={z} onClick={()=>toggleZona(z)} style={{...itemBase,background:selZonas.includes(z)?"rgba(6,182,212,0.08)":"transparent"}}>
                  <div style={{width:14,height:14,borderRadius:4,border:`1px solid ${selZonas.includes(z)?ACCENT1:BORDER}`,background:selZonas.includes(z)?ACCENT1:"transparent",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,fontSize:9,color:"#fff"}}>
                    {selZonas.includes(z)&&"✓"}
                  </div>
                  <span style={{fontSize:12,color:selZonas.includes(z)?T1:T2,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{z}</span>

                      <td style={{padding:"6px 10px",textAlign:"right",color:"#34D399",fontWeight:500}}>{metric==="pesos"?fmtM(ztot):fmtU(ztot)}</td>

                {periods.map(p=><td key={p} style={{padding:"8px 10px",textAlign:"right",color:T1,fontWeight:500}}>{metric==="pesos"?fmtM(periodGrandTotal(p)):fmtU(periodGrandTotal(p))}</td>)}

  )
}

/* ─── APP ───────────────────────────────────────────────────────────────────── */
function App(){
  const[cube,setCube]=useState(null)
  const[articulos,setArticulos]=useState(null)
  const[provArts,setProvArts]=useState({})
  const[ruboArts,setRuboArts]=useState({})
  const[meta,setMeta]=useState(null)
  const[storageInfo,setStorageInfo]=useState(null)
  const[rawHeaders,setRawHeaders]=useState(null)
  const[rawRows,setRawRows]=useState(null)
  const[pendingImport,setPendingImport]=useState(null)
  const[saveStage,setSaveStage]=useState("idle")
  const[saveProgress,setSaveProgress]=useState(0)
  const[saveMsg,setSaveMsg]=useState("")
  const[activeTab,setActiveTab]=useState("resumen")
  const[fileKey,setFileKey]=useState(0)
  const fileRef=useRef()
  const[fYear,setFYear]=useState("__ALL__")
  const[fMes,setFMes]=useState("__ALL__")
  const[fProv,setFProv]=useState("__ALL__")
  const[fRubro,setFRubro]=useState("__ALL__")
  const[fVend,setFVend]=useState("__ALL__")
  const[fRentab,setFRentab]=useState("__ALL__")
  const[fPcia,setFPcia]=useState("__ALL__")
  const[fCliente,setFCliente]=useState("__ALL__")
  const[fEmpresa,setFEmpresa]=useState("__ALL__")
  const[fZona,setFZona]=useState("__ALL__")

  const records=cube||[]

  useEffect(()=>{
    const t0=Date.now()
    loadData().then(({cube:c,articulos:a,meta:m,provArts:pa,ruboArts:ra,error})=>{
      const ms=Date.now()-t0
      if(error){setStorageInfo({ok:false,error});setCube([]);setArticulos([]);setMeta({});setProvArts({});setRuboArts({});return}
      const rows=c?.length||0,cells=rows*9
      setStorageInfo({ok:true,loaded:true,rows,cells,ms})
      setCube(c||[]);setArticulos(a||[]);setMeta(m||{});setProvArts(pa||{});setRuboArts(ra||{})
    })
  },[])

  const handleFile=useCallback(async e=>{
    const file=e.target.files?.[0];if(!file) return
    setFileKey(k=>k+1)
    const ab=await file.arrayBuffer()
    const wb=XLSX.read(ab,{type:"array"})
    const ws=wb.Sheets[wb.SheetNames[0]]
    const raw=XLSX.utils.sheet_to_json(ws,{header:1,defval:""})
    if(raw.length<2) return
    const headers=raw[0].map(String)
    setRawHeaders(headers)
    setRawRows(raw.slice(1))
  },[])

  const handleMappingConfirm=useCallback((mapping,pet)=>{
    if(!rawRows||!rawHeaders) return
    const has=k=>!!mapping[k]
    const get=(row,k)=>mapping[k]!=null?row[rawHeaders.indexOf(mapping[k])]:null
    const newMeta={
      hasProveedor:has("proveedor"),hasRubro:has("rubro"),hasVendedor:has("vendedor"),
      hasRentabilidad:has("rentabilidad"),hasProvincia:has("provincia"),hasCliente:has("cliente"),
      hasEmpresa:has("empresa"),hasLocalidad:has("localidad"),hasZona:has("zona"),
      hasArticulo:has("articulo"),hasCantidad:has("cantidad"),hasCosto:has("costo"),
    }
    const parsed=rawRows.map(row=>{
      const dt=parseDate(get(row,"fecha"))
      const rp=parseFloat(String(get(row,"precio")||"0").replace(/[^\d.,-]/g,"").replace(",","."))||0
      const rq=has("cantidad")?parseFloat(String(get(row,"cantidad")||"1").replace(/[^\d.,-]/g,"").replace(",","."))||1:1
      const rc=has("costo")?parseFloat(String(get(row,"costo")||"0").replace(/[^\d.,-]/g,"").replace(",","."))||0:0
      const precio=pet?rp:rp*(rq||1),costo=pet?rc:rc*(rq||1),cantidad=rq||1
      let rentabilidad=null
      if(has("rentabilidad")){const rv=String(get(row,"rentabilidad")??"").trim();const rn=rv.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");rentabilidad=rn==="alta"?"Alta":rn==="media"?"Media":rn==="baja"?"Baja":(rv||"Sin dato")}
      return{y:dt?.y??0,m:dt?.m??0,precio,costo,cantidad,rentabilidad,
        proveedor:has("proveedor")?(String(get(row,"proveedor")??"").trim()||"Sin proveedor"):null,
        rubro:has("rubro")?(String(get(row,"rubro")??"").trim()||"Sin rubro"):null,
        articulo:has("articulo")?(String(get(row,"articulo")??"").trim()||"Sin artículo"):null,
        vendedor:has("vendedor")?(String(get(row,"vendedor")??"").trim()||"Sin vendedor"):null,
        provincia:has("provincia")?(String(get(row,"provincia")??"").trim()||"Sin provincia"):null,
        cliente:has("cliente")?(String(get(row,"cliente")??"").trim()||"Sin cliente"):null,
        empresa:has("empresa")?(String(get(row,"empresa")??"").trim()||"Sin empresa"):null,
        localidad:has("localidad")?(String(get(row,"localidad")??"").trim()||"Sin localidad"):null,
        zona:has("zona")?(String(get(row,"zona")??"").trim()||"Sin zona"):null}
    }).filter(r=>r.y>0||r.precio>0)
    const{cube:nc,articulos:na,provArts:npa,ruboArts:nra}=buildCube(parsed)
    const mc=mergeCubes(records,nc),ma=mergeArts(articulos||[],na)
    const mpa=mergeXRef(provArts||{},npa),mra=mergeXRef(ruboArts||{},nra)
    const cubeKB=Math.round(JSON.stringify(compressCube(mc)).length/1024)
    const ventas=parsed.reduce((s,r)=>s+r.precio,0),unidades=parsed.reduce((s,r)=>s+r.cantidad,0)
    const periods=[...new Set(parsed.map(r=>toPeriod(r.y,r.m)).filter(v=>v>0))].sort((a,b)=>a-b)
    setRawHeaders(null);setRawRows(null)
    setPendingImport({newCube:nc,newArts:na,newProvArts:npa,newRuboArts:nra,newMProvArts:mpa,newMRuboArts:mra,meta:newMeta,stats:{rows:parsed.length,ventas,unidades,hasCantidad:has("cantidad"),periods,existingRows:meta?.totalRows||0,cubeKB}})
  },[rawHeaders,rawRows,records,articulos,meta])

  const handleImportConfirm=useCallback(async()=>{
    if(!pendingImport) return
    setPendingImport(null);setActiveTab("resumen")
    setSaveStage("merging");setSaveProgress(15);await new Promise(r=>setTimeout(r,0))
    const mc=mergeCubes(records,pendingImport.newCube),ma=mergeArts(articulos||[],pendingImport.newArts)
    const mpa=pendingImport.newMProvArts||{},mra=pendingImport.newMRuboArts||{}
    const nm={...pendingImport.meta,totalRows:(meta?.totalRows||0)+pendingImport.stats.rows}
    setSaveStage("compressing");setSaveProgress(40);await new Promise(r=>setTimeout(r,0))
    setCube(mc);setArticulos(ma);setMeta(nm);setProvArts(mpa);setRuboArts(mra)
    setSaveStage("saving");setSaveProgress(70);await new Promise(r=>setTimeout(r,0))
    try{
      const kb=await saveData(mc,ma,nm,mpa,mra)
      setSaveStage("saved");setSaveProgress(100);setSaveMsg(`Guardado · ${fmtN(kb)} KB`)
      setTimeout(()=>{setSaveStage("idle");setSaveProgress(0);setSaveMsg("")},5000)
    }catch(e){setSaveStage("error");setSaveProgress(0);setSaveMsg(String(e))}
  },[pendingImport,records,articulos,meta])

  const handleClear=async()=>{if(!confirm("¿Eliminar todos los datos?")) return;await clearData();setCube([]);setArticulos([]);setMeta({})}

  const exportarPDF=useCallback(async()=>{
    const btn=document.getElementById("btnExportPDF")
    if(btn){btn.disabled=true;btn.textContent="Generando..."}

    // ── 1. Ocultar panel de filtros y reemplazarlo con pills compactos ──
    const filterPanel=document.getElementById("clientes-filter-panel")
    let pillsDiv=null
    if(filterPanel){
      filterPanel.style.display="none"
      // Leer filtros activos desde el DOM (pills ya renderizados) o construirlos
      const activePills=[]
      // Vendedores activos: buscar spans dorados dentro del panel
      filterPanel.querySelectorAll("span").forEach(sp=>{
        if(sp.style.color==="#F5B301"||sp.style.color==="rgb(245, 179, 1)"){
          const txt=sp.textContent.replace("×","").trim()
          if(txt) activePills.push({label:txt,color:"#F5B301",bg:"rgba(245,179,1,0.15)"})
        }
      })
      // Zonas activas
      filterPanel.querySelectorAll("span").forEach(sp=>{
        if(sp.style.color==="#22D3EE"||sp.style.color==="rgb(34,211,238)"){
          const txt=sp.textContent.replace("×","").trim()
          if(txt) activePills.push({label:txt,color:"#22D3EE",bg:"rgba(6,182,212,0.15)"})
        }
      })
      // Métrica activa: leer el botón activo del MetricToggle
      const metricBtn=document.querySelector("[data-metric-active='true']")
      const metricLabel=metricBtn?metricBtn.textContent.trim():null

      // Totales: leer del panel
      const totalEls=filterPanel.querySelectorAll("div")
      let clientesVal="",totalVal=""
      totalEls.forEach(d=>{
        if(d.textContent.trim()==="Clientes") clientesVal=d.nextElementSibling?.textContent?.trim()||""

      // Label "Filtros:"
      const lbl=document.createElement("span")
      lbl.style.cssText="font-size:10px;color:#555;text-transform:uppercase;letter-spacing:1px;margin-right:4px;font-family:Segoe UI,sans-serif"
      lbl.textContent="Filtros activos:"
      pillsDiv.appendChild(lbl)

      if(activePills.length===0){
        const np=document.createElement("span")
        np.style.cssText="font-size:11px;color:#A0A0A0;font-family:Segoe UI,sans-serif"
        np.textContent="Sin filtros aplicados"
        pillsDiv.appendChild(np)
      } else {
        activePills.forEach(p=>{
          const sp=document.createElement("span")
          sp.style.cssText=`font-size:11px;color:${p.color};background:${p.bg};border-radius:20px;padding:3px 10px;font-family:Segoe UI,sans-serif`
          sp.textContent=p.label
          pillsDiv.appendChild(sp)
        })
      }

      // Métrica y totales a la derecha
      const right=document.createElement("div")
      right.style.cssText="margin-left:auto;display:flex;align-items:center;gap:16px"
      if(metricLabel){
        const ms=document.createElement("span")
        ms.style.cssText="font-size:11px;color:#A0A0A0;font-family:Segoe UI,sans-serif"
        ms.textContent="Métrica: "+metricLabel
        right.appendChild(ms)
      }
      if(clientesVal||totalVal){
        const ts=document.createElement("span")
        ts.style.cssText="font-size:11px;color:#A0A0A0;font-family:Segoe UI,sans-serif"
        ts.innerHTML=`<span style='color:#F5B301;font-weight:600'>${clientesVal}</span> clientes &nbsp;·&nbsp; Total: <span style='color:#22D3EE;font-weight:600'>${totalVal}</span>`
        right.appendChild(ts)
      }
      pillsDiv.appendChild(right)
      filterPanel.parentNode.insertBefore(pillsDiv,filterPanel)
    }

    // ── 2. Quitar overflow/maxHeight de contenedores scrollables ──
    const snapshots=[]
    const allEls=document.querySelectorAll("*")
    allEls.forEach(el=>{
      const s=el.style
      if(s.overflow||s.overflowY||s.overflowX||s.maxHeight){
        snapshots.push({el,overflow:s.overflow,overflowY:s.overflowY,overflowX:s.overflowX,maxHeight:s.maxHeight})
        s.overflow="visible"
        s.overflowY="visible"
        s.overflowX="visible"
        s.maxHeight="none"
      }
    })
    const styleOverride=document.createElement("style")
    styleOverride.id="pdf-override"
    styleOverride.textContent=`
      #dashfact-content, #dashfact-content * {
        overflow: visible !important;
        max-height: none !important;
      }
      .dash-sidebar { overflow: hidden !important; }
    `
    document.head.appendChild(styleOverride)
    await new Promise(r=>setTimeout(r,150))

    try{
      const el=document.getElementById("dashfact-content")
      const SCALE=1,JPEG_Q=0.75
      const canvas=await html2canvas(el,{
        scale:SCALE,
        useCORS:true,
        backgroundColor:"#0A0A0A",
        logging:false,
        scrollX:0,
        scrollY:0,
        windowWidth:el.scrollWidth,
        windowHeight:el.scrollHeight,
        ignoreElements:e=>e.id==="btnExportPDF"
      })
      const toJpeg=c=>c.toDataURL("image/jpeg",JPEG_Q)
      const{jsPDF}=window.jspdf
      const pdf=new jsPDF({orientation:"landscape",unit:"mm",format:"a4"})
      const pageW=pdf.internal.pageSize.getWidth(),pageH=pdf.internal.pageSize.getHeight()
      const margin=8,imgW=pageW-margin*2
      const scaleFactor=imgW/canvas.width
      const usableH_px=(pageH-margin*2)/scaleFactor
      const totalH_px=canvas.height
      if(totalH_px<=usableH_px){
        pdf.addImage(toJpeg(canvas),"JPEG",margin,margin,imgW,totalH_px*scaleFactor)
      }else{
        const rows=el.querySelectorAll("tr")
        const breaks=[0]
        rows.forEach(row=>{
          const rect=row.getBoundingClientRect()
          const elRect=el.getBoundingClientRect()
          const bottom=Math.round((rect.bottom-elRect.top)*SCALE)
          if(bottom>0&&bottom<totalH_px) breaks.push(bottom)
        })
        breaks.push(totalH_px)
        const pts=[...new Set(breaks)].sort((a,b)=>a-b)
        let start=0,pageNum=0
        while(start<totalH_px){
          if(pageNum>0) pdf.addPage()
          const targetEnd=start+usableH_px
          let breakAt=totalH_px
          if(targetEnd<totalH_px){
            const valid=pts.filter(b=>b>start&&b<=targetEnd)
            breakAt=valid.length>0?valid[valid.length-1]:Math.min(targetEnd,totalH_px)
          }
          const sliceH=breakAt-start
          const sc=document.createElement("canvas")
          sc.width=canvas.width;sc.height=sliceH
          sc.getContext("2d").drawImage(canvas,0,start,canvas.width,sliceH,0,0,canvas.width,sliceH)
          pdf.addImage(toJpeg(sc),"JPEG",margin,margin,imgW,sliceH*scaleFactor)
          start=breakAt;pageNum++
        }
      }
      pdf.save("dashfact-reporte.pdf")
    }catch(e){alert("Error al generar PDF: "+e.message)}

    // ── 3. Restaurar todo ──
    snapshots.forEach(({el,overflow,overflowY,overflowX,maxHeight})=>{
      el.style.overflow=overflow
      el.style.overflowY=overflowY
      el.style.overflowX=overflowX
      el.style.maxHeight=maxHeight
    })
    const ov=document.getElementById("pdf-override")
    if(ov) ov.remove()
    if(pillsDiv) pillsDiv.remove()
    if(filterPanel) filterPanel.style.display=""
    if(btn){btn.disabled=false;btn.textContent="⬇ Exportar PDF"}
  },[])
