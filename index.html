<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>VentasTrack</title>
  <script src="https://cdn.jsdelivr.net/npm/react@17.0.2/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@17.0.2/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prop-types@15.8.1/prop-types.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/recharts@2.1.9/umd/Recharts.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.23.2/babel.min.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#111318;font-family:'Segoe UI',sans-serif;color:#e8edf5}
    ::-webkit-scrollbar{width:4px;height:4px}
    ::-webkit-scrollbar-thumb{background:#3a424f;border-radius:3px}
    input,select{background:#1a1f28;border:1px solid #3a424f;color:#e8edf5;border-radius:8px;padding:7px 11px;font-family:inherit;font-size:14px;outline:none;width:100%}
    input:focus,select:focus{border-color:#58a6ff}
    button{cursor:pointer;font-family:inherit;transition:all .15s}
    .card{background:#1a1f28;border:1px solid #2d3440;border-radius:12px;padding:14px;margin-bottom:10px}
    .btn-g{background:none;border:1px solid #3a424f;color:#d8dfe8;padding:7px 12px;border-radius:8px;font-size:13px}
    .btn-g:hover{border-color:#58a6ff;color:#58a6ff}
    .btn-s{background:none;border:1px solid #3a424f;color:#a8b3c2;padding:5px 10px;border-radius:6px;font-size:12px}
    .btn-s.on{background:#21262d;border-color:#58a6ff;color:#58a6ff}
    .tab{background:none;border:none;border-bottom:2px solid transparent;color:#a8b3c2;padding:9px 14px;white-space:nowrap;font-size:13px;font-weight:500}
    .tab.on{color:#58a6ff;border-bottom-color:#58a6ff}
    .pbg{background:#2d3440;border-radius:99px;overflow:hidden}
    .pfill{height:100%;border-radius:99px;transition:width .6s}
    .chip{display:inline-flex;align-items:center;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600}
    .kv{display:grid;gap:10px;margin-bottom:12px;grid-template-columns:repeat(2,1fr)}
    @media(min-width:600px){.kv{grid-template-columns:repeat(3,1fr)}}
    @media(min-width:900px){.kv{grid-template-columns:repeat(5,1fr)}}
    .c2{display:grid;gap:12px;margin-bottom:10px;grid-template-columns:1fr}
    @media(min-width:700px){.c2{grid-template-columns:1fr 1fr}}
    .rtbl{border-collapse:collapse;width:100%;font-size:12px}
    .rtbl th,.rtbl td{border:1px solid #252d3a;padding:0}
    .rtbl th{background:#161b22;color:#a8b3c2;font-weight:600;text-align:center}
    .rtbl .lbl{text-align:left;padding:4px 10px;white-space:nowrap;background:#13181f;color:#a8b3c2;font-size:11px}
    .rtbl .lbl.today{color:#58a6ff;font-weight:700;background:#0d1f33}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;
    const { BarChart, Bar, XAxis, YAxis, Tooltip, ResponsiveContainer, PieChart, Pie, Cell, Legend } = Recharts;

    const MONTHS = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
    const MS = ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
    const TODAY = new Date();
    const CUR_MONTH = TODAY.getMonth();
    const CUR_YEAR  = TODAY.getFullYear();

    const COLORS = [
      "#4C9BE8","#2ECC8A","#F0A500","#E05C5C","#A87FDB",
      "#00BFAE","#F472B6","#6EE7B7","#FB923C","#818CF8",
    ];

    const C = { bg:"#111318", card:"#1a1f28", border:"#2d3440", b2:"#3a424f", text:"#e8edf5", sub:"#d8dfe8", muted:"#a8b3c2", faint:"#7a8799" };

    const fmt    = n => !n&&n!==0?"$0":"$"+Number(n).toLocaleString("es-AR",{maximumFractionDigits:0});
    const fmtK   = n => {
      if(!n) return "$0";
      const abs=Math.abs(n);
      if(abs>=1e9) return "$"+(n/1e9).toFixed(1)+"B";
      if(abs>=1e6) return "$"+(n/1e6).toFixed(1)+"M";
      if(abs>=1e3) return "$"+(n/1e3).toFixed(0)+"k";
      return "$"+n;
    };
    const fmtObj = n => {
      if(!n) return "—";
      const abs=Math.abs(n);
      if(abs>=1e6){ const v=n/1e6; return "$"+(v%1===0?v.toFixed(0):v.toFixed(1))+"M"; }
      if(abs>=1e3){ const v=n/1e3; return "$"+(v%1===0?v.toFixed(0):v.toFixed(1))+"k"; }
      return "$"+n;
    };

    const pct    = (v,g) => !g?0:Math.round(v/g*100);
    const sc     = p => p>=100?"#2ECC8A":p>=70?"#F0A500":"#E05C5C";
    const scBg   = p => p>=100?"#172217":p>=70?"#231f0e":"#221515";
    const dim    = (m,y) => new Date(y,m+1,0).getDate();
    const wknd   = d => { const w=d.getDay(); return w===0||w===6; };
    const isoD   = (y,m,d) => `${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const hk     = (m,y) => `${y}-${String(m+1).padStart(2,"0")}`;
    const bk     = (m,y) => `${y}-${m}`;
    const fmtPct = n => n.toLocaleString("es-AR",{minimumFractionDigits:2,maximumFractionDigits:2})+"%";
    const fmtAmt = n => n===0?"$ -":"$ "+Number(n).toLocaleString("es-AR",{minimumFractionDigits:0,maximumFractionDigits:0});

    function parseDateParts(iso) {
      if (!iso||iso.length<10) return null;
      const y=+iso.slice(0,4), m=+iso.slice(5,7)-1, d=+iso.slice(8,10);
      if (isNaN(y)||isNaN(m)||isNaN(d)) return null;
      return {y,m,d};
    }

    const MONTH_MAP = (()=>{
      const m={};
      ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"]
        .forEach((n,i)=>{ m[n]=i; m[MS[i].toLowerCase()]=i; m[String(i+1)]=i; m[String(i+1).padStart(2,"0")]=i; });
      return m;
    })();

    function buildDays(m,y,hols=[]) {
      return Array.from({length:dim(m,y)},(_,i)=>{
        const d=i+1, dt=new Date(y,m,d), s=isoD(y,m,d);
        return {d,s,work:!wknd(dt)&&!hols.includes(s),dt};
      });
    }
    const TWD  = dl => dl.filter(x=>x.work).length;
    const wdTo = (dl,u) => dl.filter(x=>x.d<=u&&x.work).length;

    function parseAmt(raw) {
      if (typeof raw==="number") return raw;
      let s=String(raw).trim().replace(/[$\s\r]/g,"");
      if (!s||s==="-") return 0;
      if (s.indexOf(",")!==-1&&s.indexOf(".")===-1) s=s.replace(",",".");
      else if (s.indexOf(",")!==-1&&s.indexOf(".")!==-1) s=s.replace(/\./g,"").replace(",",".");
      else s=s.replace(/\./g,"");
      return parseFloat(s)||0;
    }
    function cleanDate(raw) {
      if (!raw) return "";
      const s=String(raw).trim().replace(/\r/g,"");
      if (s.includes("T")) return s.slice(0,10);
      const pts=s.split(/[-/]/);
      if (pts.length===3) {
        if (pts[0].length===4) return s.slice(0,10);
        return `${pts[2].length===4?pts[2]:"20"+pts[2]}-${pts[1].padStart(2,"0")}-${pts[0].padStart(2,"0")}`;
      }
      return s;
    }
    // Parser CSV robusto (RFC4180): respeta comillas, comas dentro de campos
    // entrecomillados, comillas escapadas ("") y saltos de línea dentro de campos.
    // El split ingenuo por "," anterior desalineaba columnas cuando un campo
    // (cliente, importe exportado con separador de miles, etc.) traía una coma.
    function parseCSVRows(text) {
      const rows=[]; let row=[]; let field=""; let inQuotes=false;
      for (let i=0;i<text.length;i++){
        const c=text[i];
        if (inQuotes) {
          if (c==='"') {
            if (text[i+1]==='"'){ field+='"'; i++; }
            else inQuotes=false;
          } else field+=c;
        } else {
          if (c==='"') inQuotes=true;
          else if (c===',') { row.push(field); field=""; }
          else if (c==='\r') { /* ignore, \n handles the break */ }
          else if (c==='\n') { row.push(field); rows.push(row); row=[]; field=""; }
          else field+=c;
        }
      }
      if (field.length||row.length) { row.push(field); rows.push(row); }
      return rows.filter(r=>r.length>1||(r.length===1&&r[0]!==""));
    }
    function parseCSV(text) {
      const rows=parseCSVRows(text.trim());
      if (rows.length<2) return [];
      const hdr=rows[0].map(h=>h.trim().toLowerCase());
      return rows.slice(1).map(vals=>{
        const obj={}; hdr.forEach((h,i)=>obj[h]=(vals[i]!==undefined?vals[i].trim():"")); return obj;
      });
    }

    const PUB_ID = "2PACX-1vSL2SaKcCwnmKdjPkw4wBNbYWfzNfHNaW1gX8Q7e-dbKALFjUd6gu3u8gffeRU-cQ";
    const GIDS = {ventas:"496653887",objetivos:"852661634",facturacion:"571985744",feriados:"260722128"};

    async function fetchSheet(name) {
      const url=`https://docs.google.com/spreadsheets/d/e/${PUB_ID}/pub?gid=${GIDS[name]}&single=true&output=csv`;
      const r=await fetch(url);
      if (!r.ok) throw new Error("HTTP "+r.status);
      return parseCSV(await r.text());
    }

    function tipColor(hex) {
      if (!hex) return C.text;
      const c = hex.replace("#","");
      const r=parseInt(c.slice(0,2),16), g=parseInt(c.slice(2,4),16), b=parseInt(c.slice(4,6),16);
      const lum = (r*299+g*587+b*114)/1000;
      return lum < 100 ? "#e8edf5" : hex;
    }
    const TTip = ({active,payload,label}) => {
      if(!active||!payload?.length) return null;
      return <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:8,padding:"10px 14px",fontSize:12}}>
        <div style={{color:"#d8dfe8",marginBottom:4,fontWeight:600}}>{label}</div>
        {payload.map((p,i)=><div key={i} style={{color:tipColor(p.color),fontWeight:600}}>{p.name}: {fmtK(p.value)}</div>)}
      </div>;
    };

    function App() {
      const [data,setData]               = useState(null);
      const [loading,setLoading]         = useState(true);
      const [error,setError]             = useState(null);
      const [lastLoad,setLastLoad]       = useState(null);
      const [tab,setTab]                 = useState("dash");
      const [selMonth,setSelMonth]       = useState(CUR_MONTH);
      const [selYear,setSelYear]         = useState(CUR_YEAR);
      const [rankSort,setRankSort]       = useState("pct");
      const [ventaFilter,setVentaFilter] = useState([]);
      const [excludedRows,setExcludedRows] = useState([]);
      const [showAudit,setShowAudit]     = useState(false);

      async function loadAll() {
        setLoading(true); setError(null);
        try {
          const [vR,oR,fR,hR] = await Promise.all([
            fetchSheet("ventas"),fetchSheet("objetivos"),fetchSheet("facturacion"),fetchSheet("feriados")
          ]);
          const fk = (r,...names) => {
            for (const n of names) {
              const k=Object.keys(r).find(k=>k.toLowerCase().trim()===n.toLowerCase());
              if (k!==undefined&&r[k]!=="") return r[k];
            }
            return "";
          };
          const salesRaw=vR.map((r,i)=>({
            id:`r${i}`, date:cleanDate(fk(r,"fecha","date")),
            seller:String(fk(r,"vendedor","seller")||"").trim(),
            client:String(fk(r,"cliente","client")||"").trim(),
            amount:parseAmt(fk(r,"importe","amount","monto","total"))
          }));
          const sales=salesRaw.filter(r=>r.seller&&r.amount>0&&r.date.length>=10);

          // ── Auditoría de carga: comparar total crudo vs. total incluido ──
          // Abrí la consola del navegador (F12) para ver el detalle si hay diferencia.
          const rawTotal=salesRaw.reduce((a,b)=>a+b.amount,0);
          const includedTotal=sales.reduce((a,b)=>a+b.amount,0);
          const excluded=salesRaw.filter(r=>!(r.seller&&r.amount>0&&r.date.length>=10)).map(r=>({
            ...r,
            motivo:!r.seller?"vendedor vacío":r.amount<=0?`importe inválido (${r.amount})`:"fecha inválida"
          }));
          if (Math.round(rawTotal)!==Math.round(includedTotal)) {
            console.warn(`[VentasTrack] Total hoja "Ventas": ${fmt(rawTotal)} · Total incluido en el dashboard: ${fmt(includedTotal)} · Diferencia: ${fmt(rawTotal-includedTotal)} (${excluded.length} filas excluidas)`);
            if (excluded.length) console.table(excluded);
          } else {
            console.log(`[VentasTrack] Totales OK: ${fmt(includedTotal)} (${sales.length} filas)`);
          }
          // Exponemos todo para inspección manual desde la consola:
          //   copy(JSON.stringify(window.__vtDebug.excluded))  → copia el detalle al portapapeles
          //   window.__vtDebug.excluded.reduce((a,b)=>a+b.amount,0)  → suma de las filas excluidas
          window.__vtDebug = {rawTotal, includedTotal, excluded, salesRaw, sales};
          setExcludedRows(excluded);

          const goals={}, sellers=[];
          oR.forEach(r=>{
            const sk=Object.keys(r).find(k=>/vendedor|seller/i.test(k));
            const seller=String(r[sk]||"").trim(); if(!seller) return;
            const yk=Object.keys(r).find(k=>/a.o|anio|ano|year/i.test(k)||k.toLowerCase().trim()==="año");
            const yr=parseInt(String(r[yk]||"").trim(),10)||CUR_YEAR;
            if(!sellers.includes(seller)) sellers.push(seller);
            if(!goals[seller]) goals[seller]={};
            Object.entries(r).forEach(([k,v])=>{
              if(/vendedor|seller/i.test(k)) return;
              if(/a.o|anio|ano|year/i.test(k)||k.toLowerCase().trim()==="año") return;
              const mi=MONTH_MAP[k.toLowerCase().trim().replace(/\s+/g,"")];
              if(mi!==undefined){const val=parseAmt(v);if(val>0) goals[seller][bk(mi,yr)]=val;}
            });
          });

          const billed={}, billable={};
          fR.forEach(r=>{
            const mk=Object.keys(r).find(k=>/mes|month/i.test(k));
            const mi=MONTH_MAP[String(r[mk]||"").toLowerCase().trim()];
            if(mi===undefined) return;
            const yk=Object.keys(r).find(k=>/a.o|anio|ano|year/i.test(k)||k.toLowerCase().trim()==="año");
            const yr=parseInt(String(r[yk]||"").trim(),10)||CUR_YEAR;
            const fk2=Object.keys(r).find(k=>/facturado|billed/i.test(k)&&!/facturable/i.test(k));
            const lk=Object.keys(r).find(k=>/facturable|billable/i.test(k));
            if(fk2) billed[bk(mi,yr)]=parseAmt(r[fk2]);
            if(lk)  billable[bk(mi,yr)]=parseAmt(r[lk]);
          });

          const holidays={};
          hR.forEach(r=>{
            const fk3=Object.keys(r).find(k=>/fecha|date/i.test(k));
            const raw=r[fk3]||Object.values(r)[0]||"";
            const f=cleanDate(String(raw).trim()); if(!f) return;
            const parts=parseDateParts(f); if(!parts) return;
            const k=hk(parts.m,parts.y);
            if(!holidays[k]) holidays[k]=[];
            const iso=isoD(parts.y,parts.m,parts.d);
            if(!holidays[k].includes(iso)) holidays[k].push(iso);
          });

          setData({sales,sellers,goals,billed,billable,holidays});
          setLastLoad(new Date());
        } catch(e) {
          setError("No se pudo cargar el Google Sheet. Verificá que esté publicado.");
        }
        setLoading(false);
      }

      useEffect(()=>{ loadAll(); },[]);

      const {sales=[],sellers=[],goals={},billed={},billable={},holidays={}} = data||{};
      const getHols=(m,y)=>holidays[hk(m,y)]||[];
      const dayList=useMemo(()=>buildDays(selMonth,selYear,getHols(selMonth,selYear)),[selMonth,selYear,data]);
      const workDays=useMemo(()=>dayList.filter(d=>d.work),[dayList]);
      const twd2=useMemo(()=>TWD(dayList),[dayList]);
      const isCur=selMonth===CUR_MONTH&&selYear===CUR_YEAR;
      const todDay=isCur?TODAY.getDate():dim(selMonth,selYear);
      const elWD=useMemo(()=>wdTo(dayList,todDay),[dayList,todDay]);
      const remWD=twd2-elWD;
      const mthPct=twd2?Math.round(elWD/twd2*100):0;

      const monthSales=useMemo(()=>sales.filter(s=>{
        const p=parseDateParts(s.date);
        return p&&p.y===selYear&&p.m===selMonth;
      }),[sales,selMonth,selYear]);

      // Solo entran los vendedores con objetivo cargado en el mes/año seleccionado.
      // Así un vendedor desvinculado deja de figurar en Dashboard/Ranking/Rendimiento
      // a partir del mes sin objetivo, pero su historial de ventas y objetivos previos
      // se conserva intacto (se sigue viendo en Ventas y Objetivos).
      const activeSellers=useMemo(()=>sellers
        .map((seller,si)=>({seller,si}))
        .filter(({seller})=>(goals[seller]&&goals[seller][bk(selMonth,selYear)])>0)
      ,[sellers,goals,selMonth,selYear]);

      const sellerData=useMemo(()=>activeSellers.map(({seller,si})=>{
        const ss=monthSales.filter(s=>s.seller===seller);
        const total=ss.reduce((a,b)=>a+b.amount,0);
        const goal=(goals[seller]&&goals[seller][bk(selMonth,selYear)])||0;
        const p=pct(total,goal),gap=goal-total;
        const exp=goal&&twd2?Math.round(goal/twd2*elWD):0;
        const dailyGoal=twd2>0?Math.round(goal/twd2):0;
        const byDay={};
        ss.forEach(s=>{
          const parts=parseDateParts(s.date);
          if(parts) byDay[parts.d]=(byDay[parts.d]||0)+s.amount;
        });
        let cumDias=0,evalDias=0;
        dayList.forEach(day=>{
          if(!day.work||day.d>todDay) return;
          evalDias++;
          if((byDay[day.d]||0)>=dailyGoal) cumDias++;
        });
        return {seller,total,goal,p,gap,vsExp:total-exp,
          color:COLORS[si%COLORS.length],
          dailyAvg:elWD?Math.round(total/elWD):0,
          dailyNeed:goal&&remWD?Math.round(Math.max(0,gap)/remWD):0,
          dailyGoal,byDay,cumDias,evalDias,pctDias:evalDias>0?Math.round(cumDias/evalDias*100):0};
      }),[activeSellers,monthSales,goals,selMonth,selYear,elWD,twd2,remWD,dayList,todDay]);

      // Auditoría sobre las ventas ya incluidas (pasaron el filtro básico de
      // carga). Cuatro señales, cada una evaluando todo el historial:
      //  - vendedorDesconocido: el nombre no matchea ningún vendedor de Objetivos (typo)
      //  - fechaSospechosa: el año-mes de la venta no tiene objetivo cargado
      //    para NINGÚN vendedor → la fecha probablemente esté mal tipeada
      //  - duplicados: misma fila (vendedor+fecha+importe) repetida
      //  - sinObjetivo: vendedor conocido, pero sin objetivo cargado ese año-mes
      //    puntual (a diferencia de fechaSospechosa, el período sí existe:
      //    otros vendedores tienen objetivo ahí, este vendedor no)
      const auditoriaVentas=useMemo(()=>{
        const periodosConObjetivo=new Set();
        Object.values(goals).forEach(g=>Object.keys(g).forEach(k=>periodosConObjetivo.add(k)));

        const vendedorDesconocido={}, sinObjetivo={}, dupMap={}, fechaSospechosa=[];
        sales.forEach(s=>{
          const p=parseDateParts(s.date); if(!p) return;
          const key=bk(p.m,p.y);

          const dk=`${s.seller}|${s.date}|${s.amount}`;
          if(!dupMap[dk]) dupMap[dk]={seller:s.seller,date:s.date,amount:s.amount,count:0};
          dupMap[dk].count++;

          if(!sellers.includes(s.seller)){
            if(!vendedorDesconocido[s.seller]) vendedorDesconocido[s.seller]={seller:s.seller,count:0,total:0};
            vendedorDesconocido[s.seller].count++;
            vendedorDesconocido[s.seller].total+=s.amount;
          } else if((goals[s.seller]&&goals[s.seller][key])>0) {
            // tiene objetivo cargado ese período, todo bien
          } else if(periodosConObjetivo.has(key)) {
            // el período existe (otros vendedores sí tienen objetivo ahí),
            // pero este vendedor puntual no
            const gk=`${s.seller}|${key}`;
            if(!sinObjetivo[gk]) sinObjetivo[gk]={seller:s.seller,year:p.y,month:p.m,total:0};
            sinObjetivo[gk].total+=s.amount;
          } else {
            // ningún vendedor tiene objetivo cargado para este año-mes:
            // la fecha de la venta probablemente esté mal tipeada
            fechaSospechosa.push({...s,motivo:"período sin objetivos cargados"});
          }
        });
        return {
          vendedorDesconocido: Object.values(vendedorDesconocido).sort((a,b)=>b.total-a.total),
          sinObjetivo: Object.values(sinObjetivo).sort((a,b)=>b.year-a.year||b.month-a.month||a.seller.localeCompare(b.seller)),
          duplicados: Object.values(dupMap).filter(d=>d.count>1),
          fechaSospechosa,
        };
      },[sales,sellers,goals]);
      const {vendedorDesconocido,sinObjetivo,duplicados,fechaSospechosa}=auditoriaVentas;
      const auditCount=excludedRows.length+sinObjetivo.length+vendedorDesconocido.length+duplicados.length+fechaSospechosa.length;


      const PeriodSel=()=>(
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:14,flexWrap:"wrap"}}>
          <span style={{color:C.muted,fontSize:13,flexShrink:0}}>Período:</span>
          <select value={selMonth} onChange={e=>setSelMonth(+e.target.value)} style={{width:"auto",minWidth:120}}>

              <div style={{marginBottom:12}}>
                <div style={{fontSize:11,color:C.muted,textTransform:"uppercase",letterSpacing:.6,marginBottom:6}}>Filtrar por vendedor</div>
                <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                  {activeSellers.map(({seller:s,si:i})=>{
                    const active=ventaFilter.includes(s);
                    const col=COLORS[i%COLORS.length];
                    return (
                      <button key={s} onClick={()=>toggleSeller(s)}
                        style={{background:active?col:"none",border:`1px solid ${col}`,color:active?"#111318":col,
                          padding:"5px 12px",borderRadius:20,fontSize:12,fontWeight:active?"600":"normal",cursor:"pointer"}}>
                        {s}
                      </button>
                    );
                  })}
                  {ventaFilter.length>0&&(
                    <button onClick={()=>setVentaFilter([])}
                      style={{background:"none",border:`1px solid ${C.b2}`,color:C.muted,padding:"5px 12px",borderRadius:20,fontSize:12,cursor:"pointer"}}>
                      Limpiar ✕
                    </button>
                  )}
                </div>
              </div>
            )}
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
              <span style={{color:C.sub}}><b style={{color:C.text}}>{sorted.length}</b> registros{ventaFilter.length>0?" (filtrado)":""}</span>
              <span style={{color:"#2ECC8A",fontWeight:700}}>{fmt(total)}</span>
            </div>
            {sorted.length===0
              ?<div className="card" style={{textAlign:"center",padding:28,color:C.muted}}>Sin ventas en este período.</div>
              :<div style={{overflowX:"auto"}}>
                <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
                  <thead><tr style={{borderBottom:`1px solid ${C.border}`}}>
                    {["Fecha","Vendedor","Cliente","Importe"].map(h=><th key={h} style={{padding:"8px 10px",textAlign:"left",color:C.muted,fontWeight:500}}>{h}</th>)}
                  </tr></thead>
                  <tbody>
                    {sorted.slice(0,500).map((s,i)=>{
                      const si=sellers.indexOf(s.seller);
                      const col=si>=0?COLORS[si%COLORS.length]:C.muted;
                      return (
                        <tr key={i} style={{borderBottom:"1px solid #1e2530"}}>
                          <td style={{padding:"7px 10px",color:C.muted,whiteSpace:"nowrap"}}>{s.date}</td>
                          <td style={{padding:"7px 10px",whiteSpace:"nowrap",color:col,fontWeight:500}}>{s.seller}</td>
                          <td style={{padding:"7px 10px",color:C.muted,maxWidth:140,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{s.client||"—"}</td>
                          <td style={{padding:"7px 10px",color:"#2ECC8A",fontWeight:600,whiteSpace:"nowrap"}}>{fmt(s.amount)}</td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            }
          </div>
        );
      }

      // ── OBJETIVOS con semáforo todos los meses pasados + mes actual resaltado ──
      function renderObj(){
        return (
          <div style={{maxWidth:960}}>
            <h2 style={{fontSize:16,fontWeight:700,marginBottom:6}}>Objetivos mensuales</h2>
            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:14}}>
              <span style={{color:C.muted,fontSize:13}}>Año:</span>
              <input type="number" value={selYear} onChange={e=>setSelYear(+e.target.value)} style={{width:72}}/>
            </div>
            <div style={{overflowX:"auto"}}>
              <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
                <thead>
                  <tr style={{borderBottom:`1px solid ${C.border}`}}>
                    <th style={{padding:"8px 10px",textAlign:"left",color:C.muted,fontWeight:500,
                      position:"sticky",left:0,background:C.card,zIndex:2,minWidth:110}}>
                      Vendedor
                    </th>
                    {MS.map((m,i)=>{
                      const isCurMo = i===CUR_MONTH && selYear===CUR_YEAR;
                      return (
                        <th key={i} style={{
                          padding:"8px 6px",textAlign:"center",minWidth:60,
                          color: isCurMo?"#58a6ff":C.muted,
                          fontWeight: isCurMo?700:500,
                          background: isCurMo?"#0d1f33":"transparent",
                          borderBottom: isCurMo?"2px solid #58a6ff":"none",
                        }}>
                          {m}
                          {isCurMo&&<span style={{display:"block",fontSize:9,color:"#58a6ff88",fontWeight:400}}>actual</span>}
                        </th>
                      );
                    })}
                  </tr>
                </thead>
                <tbody>
                  {sellers.map((seller,si)=>{
                    const col=COLORS[si%COLORS.length];
                    return (
                      <tr key={seller} style={{borderBottom:"1px solid #1e2530"}}>
                        <td style={{padding:"8px 10px",fontWeight:600,whiteSpace:"nowrap",
                          position:"sticky",left:0,background:C.card,zIndex:1,color:col}}>
                          {seller}
                        </td>
                        {MONTHS.map((_,mo)=>{
                          const g = goals[seller]&&goals[seller][bk(mo,selYear)];
                          const isCurMo  = mo===CUR_MONTH && selYear===CUR_YEAR;
                          // semáforo para meses pasados Y mes actual del año seleccionado
                          const isPastMo = selYear < CUR_YEAR || (selYear===CUR_YEAR && mo <= CUR_MONTH);
                          const futureMo = !isPastMo;

                          // venta real de ese mes
                          const ventaMo = isPastMo ? sales.filter(s=>{
                            const p=parseDateParts(s.date);
                            return p&&p.y===selYear&&p.m===mo&&s.seller===seller;
                          }).reduce((a,b)=>a+b.amount,0) : 0;

                          const p = pct(ventaMo, g||0);
                          const semColor = sc(p);
                          const semBg    = scBg(p);

                          return (
                            <td key={mo} style={{
                              textAlign:"center",padding:"6px 4px",
                              background: futureMo ? "transparent" : (g ? semBg : "#1a1a1a"),
                              borderLeft:  isCurMo ? "1px solid #58a6ff33" : "none",
                              borderRight: isCurMo ? "1px solid #58a6ff33" : "none",
                              // columna actual con fondo levemente más intenso
                              ...(isCurMo ? {background: g ? semBg : "#0d1f2a"} : {}),
                            }}>
                              {g
                                ? <span style={{
                                    fontSize:12,fontWeight:600,
                                    color: futureMo ? C.sub : semColor,
                                  }}>
                                    {fmtObj(g)}
                                  </span>
                                : <span style={{color:C.faint,fontSize:12}}>—</span>
                              }
                            </td>
                          );
                        })}
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>

            {/* Leyenda semáforo */}
            <div style={{display:"flex",alignItems:"center",gap:16,marginTop:14,flexWrap:"wrap"}}>
              <span style={{fontSize:11,color:C.faint,textTransform:"uppercase",letterSpacing:.5}}>Semáforo:</span>
              {[
                {bg:"#172217",col:"#2ECC8A",label:"≥ 100% del objetivo"},
                {bg:"#231f0e",col:"#F0A500",label:"70–99%"},
                {bg:"#221515",col:"#E05C5C",label:"< 70%"},
                {bg:"transparent",col:C.sub,label:"Mes futuro (sin dato)"},
              ].map(l=>(
                <span key={l.label} style={{display:"flex",alignItems:"center",gap:5}}>
                  <span style={{width:12,height:12,borderRadius:3,background:l.bg,
                    border:`1px solid ${l.col}66`,display:"inline-block"}}/>
                  <span style={{fontSize:11,color:l.col}}>{l.label}</span>
                </span>
              ))}
            </div>
          </div>
        );
      }

      function renderFeriados(){
        const m=selMonth,yr=selYear,hols=getHols(m,yr);
        const dl=buildDays(m,yr,hols);
        const fdow=new Date(yr,m,1).getDay(),adj=(fdow+6)%7;
        const todISO=isoD(CUR_YEAR,CUR_MONTH,TODAY.getDate());
        const cells=[]; for(let i=0;i<adj;i++) cells.push(null); dl.forEach(d=>cells.push(d));
        return (
          <div style={{maxWidth:440}}>
            <h2 style={{fontSize:16,fontWeight:700,marginBottom:6}}>Días no laborables</h2>
            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:14,flexWrap:"wrap"}}>
              <select value={m} onChange={e=>setSelMonth(+e.target.value)} style={{width:"auto",minWidth:120}}>
                {MONTHS.map((mo,i)=><option key={i} value={i}>{mo}</option>)}
              </select>
              <input type="number" value={yr} onChange={e=>setSelYear(+e.target.value)} style={{width:72}}/>
              <span className="chip" style={{background:"#E05C5C22",color:"#E05C5C"}}>{hols.length} feriados</span>
              <span className="chip" style={{background:"#4C9BE822",color:"#4C9BE8"}}>{TWD(dl)} hábiles</span>
            </div>
            <div className="card">
              <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:3,marginBottom:4}}>
                {["L","M","X","J","V","S","D"].map(d=><div key={d} style={{textAlign:"center",fontSize:12,color:C.muted,padding:3,fontWeight:600}}>{d}</div>)}
              </div>
              <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:3}}>
                {cells.map((cell,i)=>{
                  if(!cell) return <div key={`e${i}`}/>;
                  const dow=new Date(yr,m,cell.d).getDay(),isW=dow===0||dow===6;
                  const isH=hols.includes(cell.s),isT=cell.s===todISO;
                  return <div key={cell.s} style={{width:"100%",aspectRatio:1,display:"flex",alignItems:"center",justifyContent:"center",borderRadius:8,fontSize:13,background:isH?"#E05C5C22":isT?"#4C9BE815":"transparent",color:isH?"#E05C5C":isW?"#5a6475":C.text,border:isH?"1px solid #E05C5C44":isT?"1px solid #4C9BE855":"1px solid transparent",fontWeight:isH?"700":"normal"}}>{cell.d}</div>;
                })}
              </div>
            </div>
          </div>
        );
      }

      const TABS=[
        {id:"dash",l:"Dashboard"},{id:"rank",l:"Ranking"},{id:"rend",l:"Rendimiento"},
        {id:"ventas",l:"Ventas"},{id:"obj",l:"Objetivos"},{id:"feriados",l:"Feriados"},
      ];

      return (
        <div style={{fontFamily:"'Segoe UI',sans-serif",minHeight:"100vh",background:C.bg,color:C.text}}>
          <div style={{maxWidth:960,margin:"0 auto",padding:12}}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16,flexWrap:"wrap",gap:8}}>
              <div style={{display:"flex",alignItems:"center",gap:8}}>
                <div style={{width:28,height:28,background:"linear-gradient(135deg,#2ECC8A,#4C9BE8)",borderRadius:7,display:"flex",alignItems:"center",justifyContent:"center",fontSize:15}}>📊</div>
                <div>
                  <div style={{fontWeight:700,fontSize:16}}>VentasTrack</div>
                  {lastLoad&&<div style={{fontSize:11,color:C.faint}}>Actualizado: {lastLoad.toLocaleString("es-AR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}</div>}
                </div>
              </div>
              <button className="btn-g" style={{fontSize:12,padding:"5px 12px"}} onClick={loadAll}>↻ Actualizar</button>
              {auditCount>0&&(
                <button className="btn-g" style={{fontSize:12,padding:"5px 12px",borderColor:"#F0A50077",color:"#F0A500"}} onClick={()=>setShowAudit(v=>!v)}>
                  ⚠ {auditCount}
                </button>
              )}
            </div>
            {showAudit&&auditCount>0&&(
              <div className="card" style={{borderColor:"#F0A50044",marginBottom:16}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
                  <b style={{color:"#F0A500",fontSize:13}}>⚠ Auditoría de datos</b>
                  <button className="btn-s" onClick={()=>setShowAudit(false)}>Cerrar ✕</button>
                </div>
                {excludedRows.length>0&&(
                  <div style={{marginBottom:14}}>
                    <div style={{fontSize:12,color:C.muted,marginBottom:6}}>
                      {excludedRows.length} fila(s) no incluida(s) al cargar la hoja "Ventas":
                    </div>
                    <div style={{overflowX:"auto"}}>
                      <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
                        <thead><tr style={{borderBottom:`1px solid ${C.border}`}}>
                          {["Fecha","Vendedor","Cliente","Importe","Motivo"].map(h=>
                            <th key={h} style={{padding:"5px 8px",textAlign:"left",color:C.faint,fontWeight:500}}>{h}</th>)}
                        </tr></thead>
                        <tbody>
                          {excludedRows.slice(0,50).map((r,i)=>(
                            <tr key={i} style={{borderBottom:"1px solid #1e2530"}}>
                              <td style={{padding:"5px 8px",color:C.muted}}>{r.date||"—"}</td>
                              <td style={{padding:"5px 8px",color:C.sub}}>{r.seller||"—"}</td>
                              <td style={{padding:"5px 8px",color:C.muted}}>{r.client||"—"}</td>
                              <td style={{padding:"5px 8px",color:C.sub}}>{r.amount?fmt(r.amount):"—"}</td>
                              <td style={{padding:"5px 8px",color:"#E05C5C"}}>{r.motivo}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                )}
                {vendedorDesconocido.length>0&&(
                  <div style={{marginBottom:14}}>
                    <div style={{fontSize:12,color:C.muted,marginBottom:6}}>
                      Vendedor no coincide con ninguno de Objetivos (posible error de tipeo):
                    </div>
                    <div style={{overflowX:"auto"}}>
                      <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
                        <thead><tr style={{borderBottom:`1px solid ${C.border}`}}>
                          {["Vendedor cargado","Ventas","Monto"].map(h=>
                            <th key={h} style={{padding:"5px 8px",textAlign:"left",color:C.faint,fontWeight:500}}>{h}</th>)}
                        </tr></thead>
                        <tbody>
                          {vendedorDesconocido.map((v,i)=>(
                            <tr key={i} style={{borderBottom:"1px solid #1e2530"}}>
                              <td style={{padding:"5px 8px",color:"#E05C5C",fontWeight:600}}>{v.seller}</td>
                              <td style={{padding:"5px 8px",color:C.muted}}>{v.count}</td>
                              <td style={{padding:"5px 8px",color:C.sub}}>{fmt(v.total)}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                )}
                {fechaSospechosa.length>0&&(
                  <div style={{marginBottom:14}}>
                    <div style={{fontSize:12,color:C.muted,marginBottom:6}}>
                      Fecha cuyo período no tiene objetivo cargado para ningún vendedor (posible error de tipeo en la fecha):
                    </div>
                    <div style={{overflowX:"auto"}}>
                      <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
                        <thead><tr style={{borderBottom:`1px solid ${C.border}`}}>
                          {["Fecha","Vendedor","Cliente","Importe","Motivo"].map(h=>
                            <th key={h} style={{padding:"5px 8px",textAlign:"left",color:C.faint,fontWeight:500}}>{h}</th>)}
                        </tr></thead>
                        <tbody>
                          {fechaSospechosa.slice(0,50).map((r,i)=>(
                            <tr key={i} style={{borderBottom:"1px solid #1e2530"}}>
                              <td style={{padding:"5px 8px",color:"#E05C5C",fontWeight:600}}>{r.date}</td>
                              <td style={{padding:"5px 8px",color:C.sub}}>{r.seller}</td>
                              <td style={{padding:"5px 8px",color:C.muted}}>{r.client||"—"}</td>
                              <td style={{padding:"5px 8px",color:C.sub}}>{fmt(r.amount)}</td>
                              <td style={{padding:"5px 8px",color:C.muted}}>{r.motivo}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                )}
                {duplicados.length>0&&(
                  <div style={{marginBottom:14}}>
                    <div style={{fontSize:12,color:C.muted,marginBottom:6}}>
                      Filas duplicadas (mismo vendedor + fecha + importe repetido):
                    </div>
                    <div style={{overflowX:"auto"}}>
                      <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
                        <thead><tr style={{borderBottom:`1px solid ${C.border}`}}>
                          {["Fecha","Vendedor","Importe","Veces"].map(h=>
                            <th key={h} style={{padding:"5px 8px",textAlign:"left",color:C.faint,fontWeight:500}}>{h}</th>)}
                        </tr></thead>
                        <tbody>
                          {duplicados.map((d,i)=>(
                            <tr key={i} style={{borderBottom:"1px solid #1e2530"}}>
                              <td style={{padding:"5px 8px",color:C.muted}}>{d.date}</td>
                              <td style={{padding:"5px 8px",color:C.sub}}>{d.seller}</td>
                              <td style={{padding:"5px 8px",color:C.sub}}>{fmt(d.amount)}</td>
                              <td style={{padding:"5px 8px",color:"#E05C5C",fontWeight:600}}>{d.count}×</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                )}
                {sinObjetivo.length>0&&(
                  <div>
                    <div style={{fontSize:12,color:C.muted,marginBottom:6}}>
                      Vendedor conocido, sin objetivo cargado ese período (no suma en Dashboard/Ranking/Rendimiento):
                    </div>
                    <div style={{overflowX:"auto"}}>
                      <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
                        <thead><tr style={{borderBottom:`1px solid ${C.border}`}}>
                          {["Vendedor","Período","Monto en juego"].map(h=>
                            <th key={h} style={{padding:"5px 8px",textAlign:"left",color:C.faint,fontWeight:500}}>{h}</th>)}
                        </tr></thead>
                        <tbody>
                          {sinObjetivo.map((g,i)=>(
                            <tr key={i} style={{borderBottom:"1px solid #1e2530"}}>
                              <td style={{padding:"5px 8px",color:C.sub}}>{g.seller}</td>
                              <td style={{padding:"5px 8px",color:C.muted}}>{MS[g.month]} {g.year}</td>
                              <td style={{padding:"5px 8px",color:"#F0A500",fontWeight:600}}>{fmt(g.total)}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                )}
              </div>
            )}
            <div style={{display:"flex",overflowX:"auto",borderBottom:"1px solid #2d3440",marginBottom:16}}>
              {TABS.map(t=><button key={t.id} className={`tab ${tab===t.id?"on":""}`} onClick={()=>setTab(t.id)}>{t.l}</button>)}
            </div>
            {error&&<div style={{textAlign:"center",padding:40}}>
              <div style={{fontSize:32,marginBottom:12}}>⚠️</div>
              <div style={{color:"#E05C5C",fontWeight:600,marginBottom:8}}>{error}</div>
              <button className="btn-g" onClick={loadAll}>↻ Reintentar</button>
            </div>}
            {!error&&tab==="dash"&&renderDash()}
            {!error&&tab==="rank"&&renderRank()}
            {!error&&tab==="rend"&&renderRendimiento()}
            {!error&&tab==="ventas"&&renderVentas()}
            {!error&&tab==="obj"&&renderObj()}
            {!error&&tab==="feriados"&&renderFeriados()}
          </div>
        </div>
      );
    }

    ReactDOM.render(<App/>, document.getElementById("root"));
  </script>
</body>
</html>
